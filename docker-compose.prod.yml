services:
  tomcat:
    build:
      context: ./docker
      dockerfile: Dockerfile
    image: cora-docker-tomcat:prod
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - CATALINA_OPTS=${CATALINA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/urandom}
      - AJP_SECRET=${AJP_SECRET:?AJP_SECRET must be set}
    healthcheck:
      test: ["CMD-SHELL", "bash -c '>/dev/tcp/localhost/8080' || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /usr/local/tomcat/work:size=256M
      - /usr/local/tomcat/temp:size=128M
      - /tmp:size=128M
    volumes:
      - tomcat-logs:/usr/local/tomcat/logs
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2.0"
        reservations:
          memory: 512m
          cpus: "0.5"

volumes:
  tomcat-logs:
